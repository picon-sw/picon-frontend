# ALB가 넘겨준 원래 프로토콜(https)을 유지하고, 없으면(로컬) 현재 프로토콜 사용
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 경로별 캐시 정책
# - /assets/: 파일명에 해시가 있어 오래 캐시
# - /api/: 백엔드가 정하도록 비워 둠 (빈 값이면 헤더를 붙이지 않음)
# - 그 외(index.html 등): 항상 새로 받아 배포 후 바로 반영
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 모든 응답에 붙는 헤더 (location에는 add_header를 두지 않아야 그대로 적용됨)
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 백엔드 API (docker compose 서비스 이름: api)
    # 요청이 올 때 주소를 찾도록 해서, 백엔드 없이 프론트만 띄워도 Nginx가 실행됨
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 3s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html로 넘겨 react-router가 처리
    location / {
        try_files $uri $uri/ /index.html;
    }
}